<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ATH — TV wall (v3 preview)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .tv-viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Frame is intentionally oversized by ZOOM — viewport clips the outer black border */
    .tv-canvas-frame {
      position: relative;
      flex-shrink: 0;
    }

    /* ── Layer 1 · Video screens ─────────────────────────────────────── */
    .tv-screens-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Screen states */
    .tv-screen {
      position: absolute;
      overflow: hidden;
      opacity: 1;
      filter: brightness(0.04);
      transition: filter 1.1s ease;
      cursor: default;
      border-radius: 3px;
    }
    .tv-screen.has-poster { filter: brightness(0.46) saturate(0.72); }
    .tv-screen.is-on      { filter: brightness(1); }

    /* Edge vignette — makes video look physically inside the bezel */
    .tv-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        /* glass glare — top-left highlight */
        linear-gradient(148deg, rgba(255,255,255,0.06) 0%, transparent 38%),
        /* edge shadow — darkens all four borders */
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.38) 100%);
    }

    .tv-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #080808;
    }

    /* ── Layer 2 · Frame overlay (canvas PNG with transparent holes) ─── */
    .tv-frame-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: center / 100% 100% no-repeat;
      pointer-events: none;
    }
    @media (min-width: 769px) {
      .tv-frame-overlay { background-image: url("assets/canvas-desktop-overlay.png"); }
    }
    @media (max-width: 768px) {
      .tv-frame-overlay { background-image: url("assets/canvas-mobile-overlay.png"); }
    }

    /* ── Layer 3 · Screen glow + atmospheric haze ───────────────────── */
    .tv-glows-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    /* Per-screen ambient glow — large soft radial centered on each screen */
    #screen-glows { position: absolute; inset: 0; }
    .tv-screen-glow {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%,
        rgba(155, 195, 250, 0.16) 0%,
        rgba(130, 170, 235, 0.07) 40%,
        transparent 70%);
      filter: blur(18px);
      opacity: 0;
      transition: opacity 2s ease;
    }
    .tv-screen-glow.glow-on { opacity: 1; }

.preview-badge {
      position: fixed;
      bottom: 12px; right: 12px;
      z-index: 10;
      font: 10px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="tv-viewport">
    <div id="frame" class="tv-canvas-frame">
      <!-- z-index 1: video screens behind the overlay -->
      <div id="stage" class="tv-screens-layer" aria-label="ATH video wall"></div>

      <!-- z-index 2: canvas PNG with transparent holes — frame/bezel/glass stays on top -->
      <div id="overlay" class="tv-frame-overlay" aria-hidden="true"></div>

      <!-- z-index 3: screen glow + atmospheric haze above everything -->
      <div class="tv-glows-layer" aria-hidden="true">
        <div id="screen-glows"></div>
      </div>
    </div>
  </div>
  <div class="preview-badge">v3 local preview</div>

  <script type="module">
    import { initTvWall } from "./tv.js";

    const MOBILE_BREAK = 768;
    const ZOOM = 1.22;   // zooms canvas in — crops outer dark borders, wall fills viewport

    const overlaySrc = window.matchMedia(`(max-width: ${MOBILE_BREAK}px)`).matches
      ? "assets/canvas-mobile-overlay.png"
      : "assets/canvas-desktop-overlay.png";

    const [pool, screens] = await Promise.all([
      fetch("./videos.json").then((r) => r.json()),
      fetch("./screens.json").then((r) => r.json()),
      new Promise((resolve) => {
        const img = new Image();
        img.onload = resolve; img.onerror = resolve;
        img.src = overlaySrc;
      }),
    ]);

    const frame      = document.getElementById("frame");
    const stage      = document.getElementById("stage");
    const overlay    = document.getElementById("overlay");
    const screenGlows = document.getElementById("screen-glows");

    let wall = null;

    function fitCanvas() {
      const isMobile = window.innerWidth <= MOBILE_BREAK;
      const src = isMobile
        ? "assets/canvas-mobile-overlay.png"
        : "assets/canvas-desktop-overlay.png";
      const ar = isMobile ? 1536 / 2752 : 2752 / 1536;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let w, h;
      if (vw / vh > ar) { h = vh; w = h * ar; }
      else               { w = vw; h = w / ar; }
      frame.style.width  = `${Math.round(w * ZOOM)}px`;
      frame.style.height = `${Math.round(h * ZOOM)}px`;
      if (!overlay.style.backgroundImage.includes(src)) {
        overlay.style.backgroundImage = `url("${src}")`;
      }
      return { isMobile };
    }

    async function mount() {
      const { isMobile } = fitCanvas();
      const layout = isMobile ? screens.mobile : screens.desktop;
      if (wall?.destroy) wall.destroy();
      wall = await initTvWall({ stageEl: stage, glowEl: screenGlows, pool, layout });
    }

    await mount();

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => mount(), 200);
    });
  </script>
</body>
</html>
