<style>
  :root {
    --ink:    #0A0A0A;
    --ink-2:  #111111;
    --ink-3:  #17181A;
    --line:   #2A2D31;
    --line-2: #3A3E44;
    --silver: #9EA5B0;
    --fg:     #F5F5F5;
    --mute:   #737373;
    --ice-1:  #BFE8F2;
    --ice-2:  #93D2E8;
    --ice-3:  #7BC4DF;
    --bevel-hi: rgba(255,255,255,0.14);
    --bevel-lo: rgba(0,0,0,0.65);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── retro bevel ───────────────────────────── */
  .bevel {
    border: 1px solid var(--line);
    box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo);
    background: var(--ink-2);
  }
  .bevel:active, .bevel[aria-expanded="true"] {
    box-shadow: inset 1px 1px 0 var(--bevel-lo), inset -1px -1px 0 var(--bevel-hi);
    transform: translate(1px, 1px);
  }

  /* ── top / bottom bars ─────────────────────── */
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mute);
    flex: 0 0 auto;
  }
  .bar a { color: var(--mute); text-decoration: none; transition: color .2s; }
  .bar a:hover { color: var(--ice-1); }

  /* ── hero cluster: wordmark + slogan + menu ── */
  .hero {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: clamp(24px, 6vh, 64px) 16px 0;
  }
  .hero-core { will-change: transform; visibility: hidden; }
  .hero-core.settle { transition: transform 1.5s cubic-bezier(0.4, 0, 0.1, 1); }
  .wordmark {
    font-family: "Source Serif 4", serif;
    font-weight: 700;
    font-size: clamp(3rem, 9vh, 5.5rem);
    line-height: 1;
    letter-spacing: 0.06em;
  }
  .slogan {
    margin-top: clamp(8px, 1.6vh, 16px);
    color: var(--silver);
    font-size: clamp(0.9rem, 2vh, 1.1rem);
    letter-spacing: 0.02em;
    min-height: 1.5em;
  }
  .cursor {
    display: inline-block; width: 0.55em; height: 1.05em;
    background: var(--ice-1); vertical-align: text-bottom; margin-left: 4px;
    animation: blink 1.15s steps(1) infinite;
  }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.08; } }

  /* ── intro reveal ──────────────────────────── */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity 1.2s ease, transform 1.2s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .reveal-x { opacity: 0; transform: translateX(64px); transition: opacity 1.5s cubic-bezier(0.3, 0, 0.15, 1), transform 1.5s cubic-bezier(0.3, 0, 0.15, 1); }
  .reveal-x.in { opacity: 1; transform: none; }

  /* ── co-founders: label above the buttons, below the gallery ── */
  .cofounders {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 1.8vh, 14px);
    padding: 0 12px clamp(8px, 1.6vh, 16px);
  }
  .cf-label {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(10.5px, 1.4vh, 12px); letter-spacing: 0.14em;
    color: var(--silver);
  }
  .cf-btns { display: flex; gap: clamp(10px, 2.2vw, 16px); }
  .cf-btn {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(10.5px, 1.5vh, 12px); letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--silver); text-decoration: none;
    padding: 11px clamp(18px, 3.5vw, 28px);
    transition: color .18s, transform .1s, box-shadow .1s;
    white-space: nowrap;
  }
  .cf-btn:hover { color: var(--ice-1); }

  /* ── section buttons ───────────────────────── */
  .menu {
    flex: 0 0 auto;
    display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(8px, 1.8vw, 14px);
    margin-top: clamp(24px, 4.5vh, 44px);
  }
  .menu button {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(10.5px, 1.5vh, 12px); letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--silver);
    padding: 12px clamp(12px, 2.8vw, 24px);
    cursor: pointer;
    transition: color .18s, transform .1s, box-shadow .1s;
    white-space: nowrap;
  }
  .menu button:hover { color: var(--ice-1); }
  .menu button[aria-expanded="true"] { color: var(--ice-1); background: var(--ink-3); }
  .menu button .caret { display: inline-block; margin-right: 6px; color: var(--ice-3); transition: transform .18s ease; }
  .menu button[aria-expanded="true"] .caret { transform: rotate(90deg); }

  /* ── panel dialog ──────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10,10,10,0.55);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    width: min(92vw, 540px);
    max-height: min(78dvh, 560px);
    display: flex; flex-direction: column;
    background: var(--ink-2);
    border: 1px solid var(--line-2);
    box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo), 0 20px 60px rgba(0,0,0,0.6);
    transform: scale(0.96) translateY(6px);
    transition: transform .18s ease;
  }
  .overlay.open .panel { transform: scale(1) translateY(0); }
  .panel-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 8px 14px;
    background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
    border-bottom: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ice-1);
    flex: 0 0 auto;
  }
  .panel-close {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--silver); cursor: pointer;
    transition: color .15s;
  }
  .panel-close:hover { color: var(--fg); }
  .panel-body { padding: 20px 22px 24px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .panel-body p { color: var(--silver); font-size: 14px; line-height: 1.65; }
  .panel-body p + p { margin-top: 12px; }
  .panel-body p em { color: var(--fg); font-style: normal; }

  .what-row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
  .what-row:last-child { border-bottom: none; }
  .what-row .num { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ice-3); flex: 0 0 auto; }
  .what-row .name { font-family: "Source Serif 4", serif; font-weight: 600; font-size: 17px; flex: 0 0 auto; }
  .what-row .desc { color: var(--mute); font-size: 13px; line-height: 1.5; }

  .touch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px; margin-bottom: 8px;
    text-decoration: none;
    border: 1px solid var(--line);
    box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo);
    background: var(--ink-3);
    transition: border-color .18s, transform .1s;
  }
  .touch-row:hover { border-color: var(--ice-3); }
  .touch-row:active { box-shadow: inset 1px 1px 0 var(--bevel-lo), inset -1px -1px 0 var(--bevel-hi); transform: translate(1px,1px); }
  .touch-row .kind { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
  .touch-row .val { color: var(--fg); font-size: 14px; }
  .touch-row .arrow { color: var(--ice-3); font-family: "JetBrains Mono", monospace; }

  /* ── gallery ───────────────────────────────── */
  .stage {
    flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column;
    position: relative;
    /* more room below than above nudges the gallery up */
    padding: clamp(10px, 2.5vh, 26px) 0 clamp(20px, 4.5vh, 48px);
  }
  @media (max-width: 719px) {
    .stage { padding-bottom: 11vh; }
  }
  .rail-wrap { position: relative; flex: 1 1 0; min-height: 0; display: flex; align-items: center; }
  .rail {
    display: flex; gap: 14px;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    width: 100%;
    padding: 4px calc(50% - var(--cardw) / 2);
  }
  .rail::-webkit-scrollbar { display: none; }
  @media (pointer: fine) { .rail { cursor: grab; } }
  .rail.dragging { scroll-snap-type: none; cursor: grabbing; user-select: none; }
  .card {
    flex: 0 0 var(--cardw);
    width: var(--cardw);
    aspect-ratio: 16 / 9;
    scroll-snap-align: center;
    position: relative;
    overflow: hidden;
    background: var(--ink-3);
    border: 1px solid var(--line);
    box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo);
    transition: border-color .25s;
    cursor: pointer;
  }
  .card:hover { border-color: var(--line-2); }
  .card video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 45%, rgba(10,10,10,0.88) 100%);
  }
  .card .scan {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(0deg, rgba(191,232,242,0.05) 0 1px, transparent 1px 3px);
    transition: opacity .3s;
  }
  .card:hover .scan { opacity: 1; }
  .card .cap { position: absolute; left: 14px; right: 52px; bottom: 12px; pointer-events: none; }
  .card .cap .client { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ice-1); }
  .card .cap .title { font-family: "Source Serif 4", serif; font-weight: 600; font-size: clamp(14px, 2vh, 18px); line-height: 1.2; margin-top: 3px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .card .xlink {
    position: absolute; right: 12px; bottom: 12px; z-index: 5;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.55); border: 1px solid var(--line);
    color: var(--silver); transition: color .15s, border-color .15s;
  }
  .card .xlink:hover { color: var(--ice-1); border-color: var(--ice-3); }
  .card .mute-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.55); border: 1px solid var(--line);
    color: var(--silver); cursor: pointer;
    backdrop-filter: blur(4px);
    transition: color .15s, border-color .15s;
  }
  .card .mute-btn:hover { color: var(--ice-1); border-color: var(--ice-3); }
  .card .play-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: opacity .25s;
  }
  .card .play-hint span {
    width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.5); border: 1px solid var(--line-2);
    color: var(--ice-1); font-size: 16px;
    backdrop-filter: blur(4px);
  }
  .card.playing .play-hint { opacity: 0; }

  button { background: none; border: none; font: inherit; color: inherit; }

  /* ── sizing: fallback; JS refines from the real free height ── */
  :root { --cardw: min(92vw, 52vh * 16 / 9, 900px); }

  /* keep all three menu buttons on one row on small phones */
  @media (max-width: 460px) {
    .menu { gap: 7px; }
    .menu button { padding: 11px 9px; font-size: 10px; letter-spacing: 0.06em; }
    .menu button .caret { margin-right: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

    { src: "videos/optimized/status_2023769377783627785_1.mp4",  poster: "videos/posters/status_2023769377783627785_1.jpg",  client: "Solflare",             title: "Comedy sketch promo 2",           x: "https://x.com/athcamera/status/2023769377783627785" },
    { src: "videos/optimized/status_2033907638787051843_1.mp4",  poster: "videos/posters/status_2033907638787051843_1.jpg",  client: "Thread visuals",       title: "Private sends",                   x: "https://x.com/athcamera/status/2033907638787051843" },
    { src: "videos/optimized/status_2061408037789913499_1.mp4",  poster: "videos/posters/status_2061408037789913499_1.jpg?v=custom",  client: "Solana",               title: "Solana Summit Berlin 2026 trailer", x: "https://x.com/Frame_tailor_/status/2061408037789913499" },
    { src: "videos/optimized/status_2051320555933171725_1.mp4",  poster: "videos/posters/status_2051320555933171725_1.jpg?v=custom",  client: "Solflare",             title: "Accelerate Miami trailer",        x: "https://x.com/solflare/status/2051320555933171725" },
  ];

  const rail = document.getElementById('rail');
  const pad2 = n => String(n).padStart(2, '0');
  rail.innerHTML = items.map((it, i) => `
    <article class="card" data-i="${i}">
      <video muted loop playsinline preload="none" data-poster="${it.poster}">
        <source src="${it.src}" type="video/mp4" />
      </video>
      <div class="shade"></div>
      <div class="scan"></div>
      <div class="play-hint"><span>▶</span></div>
      <button class="mute-btn" aria-label="Toggle sound">
        <svg width="15" height="15" data-ic="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>
        <svg width="15" height="15" data-ic="on" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <div class="cap">
        <div class="client">${it.client}</div>
        <div class="title">${it.title}</div>
      </div>
      <a class="xlink" href="${it.x}" target="_blank" rel="noopener" aria-label="View on X" onclick="event.stopPropagation()">
        <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.008 4.09H5.078z"/></svg>
      </a>
    </article>
  `).join('');

  const cards = [...rail.querySelectorAll('.card')];

  /* card width = whatever actually fits: real rail height and viewport width */
  const railWrap = document.querySelector('.rail-wrap');
  function sizeCards(){
    const vw = document.documentElement.clientWidth;
    const h = railWrap.clientHeight - 10;
    const maxW = Math.min(vw * (vw >= 720 ? 0.74 : 0.92), 900);
    const w = Math.max(200, Math.min(h * 16 / 9, maxW));
    document.documentElement.style.setProperty('--cardw', Math.round(w) + 'px');
  }
  sizeCards();
  new ResizeObserver(sizeCards).observe(railWrap);
  window.addEventListener('resize', sizeCards);

  /* lazy posters: load only near-viewport cards */
  const posterIO = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const v = en.target.querySelector('video');
      if (v.dataset.poster) { v.poster = v.dataset.poster; delete v.dataset.poster; }
      posterIO.unobserve(en.target);
    });
  }, { root: rail, rootMargin: '0px 60% 0px 60%' });
  cards.forEach(c => posterIO.observe(c));

  /* current card = nearest to scroll position */
  let current = 0;
  function updateCurrent(){
    const cardw = cards[0].getBoundingClientRect().width;
    const gap = parseFloat(getComputedStyle(rail).columnGap) || 14;
    current = Math.max(0, Math.min(items.length - 1, Math.round(rail.scrollLeft / (cardw + gap))));
  }
  updateCurrent();
  rail.addEventListener('scroll', () => requestAnimationFrame(updateCurrent), { passive: true });

  /* pause videos scrolled out of view */
  const pauseIO = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.intersectionRatio < 0.5) {
        const v = en.target.querySelector('video');
        if (!v.paused) { v.pause(); en.target.classList.remove('playing'); }
      }
    });
  }, { root: rail, threshold: [0.5] });
  cards.forEach(c => pauseIO.observe(c));

  function scrollToCard(i){
    const clamped = Math.max(0, Math.min(items.length - 1, i));
    cards[clamped].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  document.addEventListener('keydown', e => {
    if (openId) return;
    if (e.key === 'ArrowLeft') scrollToCard(current - 1);
    if (e.key === 'ArrowRight') scrollToCard(current + 1);
  });

  /* drag-to-scroll with the mouse (touch scrolls natively) */
  if (window.matchMedia('(pointer: fine)').matches) {
    let down = false, startX = 0, startScroll = 0, moved = 0;
    rail.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      down = true; moved = 0; startX = e.clientX; startScroll = rail.scrollLeft;
      rail.classList.add('dragging');
    });
    window.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      rail.scrollLeft = startScroll - dx;
    });
    window.addEventListener('pointerup', () => {
      if (!down) return;
      down = false;
      rail.classList.remove('dragging');
      if (moved > 8) { updateCurrent(); scrollToCard(current); }
    });
    /* a drag should not count as a click on the card */
    rail.addEventListener('click', e => {
      if (moved > 8) { e.stopPropagation(); e.preventDefault(); moved = 0; }
    }, true);
  }

  /* mouse wheel moves the gallery card by card */
  let wheelAcc = 0, wheelLock = 0;
  rail.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    const now = Date.now();
    if (now < wheelLock) return;
    wheelAcc += d;
    if (Math.abs(wheelAcc) > 40) {
      scrollToCard(current + (wheelAcc > 0 ? 1 : -1));
      wheelAcc = 0;
      wheelLock = now + 450;
    }
  }, { passive: false });

  function muteAllExcept(except){
    cards.forEach(c => {
      const v = c.querySelector('video');
      if (v !== except) {
        v.muted = true;
        c.querySelector('[data-ic="off"]').style.display = '';
        c.querySelector('[data-ic="on"]').style.display = 'none';
      }
    });
  }

  /* ── intro: ATH + slogan type in screen center → float up → gallery → buttons ── */
  const sloganFull = "extra content and growth layer for projects on Solana";
  const sloganText = document.getElementById('sloganText');
  const sloganCursor = document.getElementById('sloganCursor');
  const heroCore = document.getElementById('heroCore');
  const wordmark = document.querySelector('.wordmark');
  const menu = document.querySelector('.menu');
  const cofounders = document.querySelector('.cofounders');
  const stage = document.querySelector('.stage');
  const footer = document.querySelector('footer');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function finishIntro(){
    stage.classList.add('in');
    setTimeout(() => menu.classList.add('in'), reduced ? 0 : 900);
    setTimeout(() => { cofounders.classList.add('in'); footer.classList.add('in'); }, reduced ? 0 : 1800);
  }
  if (reduced) {
    sloganText.textContent = sloganFull;
    heroCore.style.visibility = 'visible';
    wordmark.classList.add('in');
    finishIntro();
  } else {
    /* shift the wordmark+slogan block so it sits in the visual center of the screen */
    const startIntro = () => {
      const r = heroCore.getBoundingClientRect();
      const delta = Math.max(0, Math.round(window.innerHeight / 2 - (r.top + r.height / 2)));
      heroCore.style.transform = 'translateY(' + delta + 'px)';
      heroCore.style.visibility = 'visible';
      setTimeout(() => wordmark.classList.add('in'), 300);
      setTimeout(() => {
        let i = 0;
        const t = setInterval(() => {
          sloganText.textContent = sloganFull.slice(0, ++i);
          if (i >= sloganFull.length) {
            clearInterval(t);
            /* pause so it can be read, then float up and bring in the rest */
            setTimeout(() => {
              heroCore.classList.add('settle');
              heroCore.style.transform = 'translateY(0)';
              setTimeout(finishIntro, 800);
            }, 1100);
          }
        }, 30);
      }, 1200);
    };
    /* wait for webfonts so the centred measurement is accurate */
    if (document.fonts && document.fonts.ready) {
      let started = false;
      const go = () => { if (!started) { started = true; startIntro(); } };
      document.fonts.ready.then(go);
      setTimeout(go, 900);
    } else {
      startIntro();
    }
  }

  cards.forEach(card => {
    const v = card.querySelector('video');
    card.addEventListener('click', (e) => {
      if (e.target.closest('.mute-btn') || e.target.closest('.xlink')) return;
      if (v.paused) { v.play().catch(()=>{}); card.classList.add('playing'); }
      else { v.pause(); card.classList.remove('playing'); }
    });
    card.querySelector('.mute-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (v.muted) {
        muteAllExcept(v);
        v.muted = false;
        v.play().catch(()=>{});
        card.classList.add('playing');
        card.querySelector('[data-ic="off"]').style.display = 'none';
        card.querySelector('[data-ic="on"]').style.display = '';
      } else {
        v.muted = true;
        card.querySelector('[data-ic="off"]').style.display = '';
        card.querySelector('[data-ic="on"]').style.display = 'none';
      }
    });
  });
})();
</script>
</body>
</html>
